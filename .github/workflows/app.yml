# Настоящее приложение: .ipa для телефона + тесты на симуляторе с картинками.
# Только ручной запуск. Репо публичное с 18.10 — минуты GitHub Actions бесплатны и без лимита.
#   gh workflow run app.yml                # всё: .ipa, юнит-тесты, UI-тесты (скриншоты ui-* и кадры anim-*)
#   gh workflow run app.yml -f mode=unit   # только юнит-тесты (PetTests) с покрытием
#   gh workflow run app.yml -f mode=ui     # только UI-тесты (PetUITests): скриншоты и контактные листы anim-*
#   gh workflow run app.yml -f mode=ipa    # только .ipa (то же, что старое -f tests=false)
# Тесты: одна сборка build-for-testing, потом test-without-building по целям, у каждой свой xcresult.
# Подробно — RESEARCH/11-ci-testing.md.
name: app
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Что делать: all | ipa | unit | ui"
        type: choice
        options: [all, ipa, unit, ui]
        default: all
      tests:
        description: "Старый флаг: false — только .ipa (как mode=ipa)"
        type: boolean
        default: true
concurrency:
  group: app
  cancel-in-progress: true
jobs:
  app:
    runs-on: macos-26
    timeout-minutes: 50
    defaults:
      run:
        working-directory: app
    env:
      XCODEGEN_VERSION: "2.45.4"
      OUT: ${{ github.workspace }}/app/out
    steps:
      - uses: actions/checkout@v4

      - name: Mode
        # Дальше шаги смотрят только на RUN_IPA / RUN_UNIT / RUN_UI / RUN_TESTS.
        env:
          MODE_IN: ${{ inputs.mode }}
          TESTS_IN: ${{ inputs.tests }}
        run: |
          MODE="${MODE_IN:-all}"
          if [ "$TESTS_IN" = "false" ]; then MODE=ipa; fi
          case "$MODE" in
            ipa)  IPA=1; UNIT=0; UI=0 ;;
            unit) IPA=0; UNIT=1; UI=0 ;;
            ui)   IPA=0; UNIT=0; UI=1 ;;
            *)    MODE=all; IPA=1; UNIT=1; UI=1 ;;
          esac
          TESTS=0
          if [ "$UNIT" = 1 ] || [ "$UI" = 1 ]; then TESTS=1; fi
          echo "Режим: $MODE (ipa=$IPA unit=$UNIT ui=$UI)"
          {
            echo "MODE=$MODE"
            echo "RUN_IPA=$IPA"
            echo "RUN_UNIT=$UNIT"
            echo "RUN_UI=$UI"
            echo "RUN_TESTS=$TESTS"
          } >> "$GITHUB_ENV"

      - name: XcodeGen
        # Готовый бинарь с релиза быстрее brew (тот тратит минуту на auto-update); brew — запасной путь.
        run: |
          xcodebuild -version
          if curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
               "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" \
             && unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP" \
             && "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version; then
            XG="$RUNNER_TEMP/xcodegen/bin/xcodegen"
          else
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
            XG=xcodegen
          fi
          "$XG" generate
          mkdir -p "$OUT/screens" "$OUT/anim"

      - name: Simulator
        # Выбираем и будим симулятор заранее: он грузится, пока собирается .ipa.
        if: ${{ env.RUN_TESTS == '1' }}
        run: |
          read -r UDID INFO < <(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          want = ["iPhone Air", "iPhone 17 Pro", "iPhone 17"]
          best = None
          for rt, devs in json.load(sys.stdin)["devices"].items():
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              if not m or int(m[1]) < 26:
                  continue
              for d in devs:
                  if d["name"] in want:
                      key = (want.index(d["name"]), -int(m[1]), -int(m[2]))
                      if best is None or key < best[0]:
                          best = (key, d["udid"], d["name"].replace(" ", "_") + "_iOS_" + m[1] + "." + m[2])
          if best is None:
              sys.exit("нет подходящего симулятора iOS 26")
          print(best[1], best[2])
          ')
          echo "Симулятор: $INFO ($UDID)"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Build ipa
        if: ${{ env.RUN_IPA == '1' }}
        timeout-minutes: 15
        run: |
          xcodebuild -project Pet.xcodeproj -scheme Pet \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Ad-hoc sign with entitlements
        if: ${{ env.RUN_IPA == '1' }}
        # Без подписи в бинарнике нет entitlements, и сайдлоадер не узнает про App Group.
        # Пути к .entitlements берём из настроек сборки, чтобы не зависеть от раскладки project.yml.
        run: |
          ent() {
            xcodebuild -project Pet.xcodeproj -target "$1" -configuration Release -sdk iphoneos \
              -showBuildSettings 2>/dev/null | awk -F ' = ' '$1 ~ /^ *CODE_SIGN_ENTITLEMENTS$/ {print $2; exit}'
          }
          APP_ENT=$(ent Pet); EXT_ENT=$(ent PetWidgets)
          echo "entitlements: Pet=$APP_ENT PetWidgets=$EXT_ENT"
          test -f "$APP_ENT" && test -f "$EXT_ENT"
          APP=build/Build/Products/Release-iphoneos/Pet.app
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign -f -s - {} \;
          fi
          codesign -f -s - --entitlements "$EXT_ENT" "$APP/PlugIns/PetWidgets.appex"
          codesign -f -s - --entitlements "$APP_ENT" "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | tee /dev/stderr | grep -q 'group.com.vadimpet.pet'
          codesign -d --entitlements - "$APP/PlugIns/PetWidgets.appex" 2>/dev/null | grep -q 'group.com.vadimpet.pet'

      - name: Package ipa
        if: ${{ env.RUN_IPA == '1' }}
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/Pet.app ipa/Payload/
          cd ipa && zip -qry "$OUT/Pet.ipa" Payload

      - uses: actions/upload-artifact@v4
        if: ${{ env.RUN_IPA == '1' }}
        with:
          name: Pet-ipa
          path: app/out/Pet.ipa
          retention-days: 30

      - name: Build for testing
        id: bft
        # Тесты собираем и после упавшей .ipa: картинки нужны всё равно.
        if: ${{ env.RUN_TESTS == '1' && !cancelled() }}
        timeout-minutes: 15
        # Одна сборка на оба набора; покрытие вшивается при сборке — включаем, только когда будут юнит-тесты.
        # Симулятор подписываем ad-hoc ("-"): так entitlements (App Group) встают и без команды.
        run: |
          COV=NO
          if [ "$RUN_UNIT" = 1 ]; then COV=YES; fi
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl status_bar "$SIM_UDID" override --time 9:41 \
            --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcodebuild build-for-testing -project Pet.xcodeproj -scheme Pet \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build-sim -enableCodeCoverage "$COV" \
            -quiet CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual

      - name: Unit tests
        if: ${{ env.RUN_UNIT == '1' && !cancelled() && steps.bft.outcome == 'success' }}
        timeout-minutes: 10
        # TEST_RUNNER_* уходит в процесс тестов без префикса: SNAPSHOT_DIR видят WidgetSnapshotTests.
        run: |
          TEST_RUNNER_SNAPSHOT_DIR="$OUT/screens" \
          xcodebuild test-without-building -project Pet.xcodeproj -scheme Pet \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build-sim -resultBundlePath "$OUT/PetTests.xcresult" \
            -only-testing:PetTests -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -quiet

      - name: Coverage
        if: ${{ env.RUN_UNIT == '1' && !cancelled() && steps.bft.outcome == 'success' }}
        run: |
          if [ ! -d "$OUT/PetTests.xcresult" ]; then echo "xcresult юнит-тестов нет"; exit 0; fi
          xcrun xccov view --report --only-targets "$OUT/PetTests.xcresult" | tee "$OUT/coverage.txt" || true

      - name: UI tests
        # Идут и после упавших юнит-тестов: скриншоты и кадры нужны всё равно.
        if: ${{ env.RUN_UI == '1' && !cancelled() && steps.bft.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          xcodebuild test-without-building -project Pet.xcodeproj -scheme Pet \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build-sim -resultBundlePath "$OUT/PetUITests.xcresult" \
            -only-testing:PetUITests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -quiet

      - name: Export screenshots
        # Вложения из каждого xcresult (Xcode 16+): файлы с UUID-именами + manifest.json с читаемыми именами.
        # Всё — в screens/, контактные листы анимации anim-* ещё и отдельно в anim/.
        if: ${{ env.RUN_TESTS == '1' && !cancelled() }}
        run: |
          RAW="$RUNNER_TEMP/attachments"
          rm -rf "$RAW" && mkdir -p "$RAW"
          for R in "$OUT"/*.xcresult; do
            [ -d "$R" ] || continue
            D="$RAW/$(basename "$R" .xcresult)"
            mkdir -p "$D"
            xcrun xcresulttool export attachments --path "$R" --output-path "$D" || echo "не выгрузилось: $R"
          done
          python3 - "$RAW" "$OUT/screens" "$OUT/anim" <<'PY'
          import json, pathlib, re, shutil, sys
          raw, dst, anim = map(pathlib.Path, sys.argv[1:])
          dst.mkdir(parents=True, exist_ok=True)
          anim.mkdir(parents=True, exist_ok=True)
          total = 0
          for d in sorted(p for p in raw.iterdir() if p.is_dir()):
              manifest = d / "manifest.json"
              if not manifest.exists():
                  print(f"{d.name}: вложений нет")
                  continue
              n = 0
              for test in json.loads(manifest.read_text()):
                  for a in test.get("attachments", []):
                      src = d / a["exportedFileName"]
                      name = a.get("suggestedHumanReadableName") or src.name
                      # «ui-01-main_0_<UUID>.png» → «ui-01-main.png»
                      name = re.sub(r"_\d+_[0-9A-Fa-f-]{36}(?=\.[^.]+$|$)", "", name)
                      if not pathlib.Path(name).suffix:
                          name += src.suffix
                      shutil.copy2(src, dst / name)
                      if name.startswith("anim-"):
                          shutil.copy2(src, anim / name)
                      n += 1
              print(f"{d.name}: вложений {n}")
              total += n
          print(f"всего вложений: {total} → {dst}")
          PY
          ls -1 "$OUT/screens"
          echo "кадры анимации:"
          ls -1 "$OUT/anim"

      - uses: actions/upload-artifact@v4
        if: ${{ env.RUN_TESTS == '1' && !cancelled() }}
        with:
          name: Pet-screens
          path: app/out/screens
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ env.RUN_UI == '1' && !cancelled() }}
        with:
          name: Pet-anim
          path: app/out/anim
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ env.RUN_TESTS == '1' && !cancelled() }}
        with:
          name: Pet-xcresult
          path: |
            app/out/*.xcresult
            app/out/coverage.txt
          if-no-files-found: ignore
          retention-days: 7
