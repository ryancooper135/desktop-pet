# Настоящее приложение: .ipa для телефона + тесты на симуляторе с картинками.
# Только ручной запуск. Репо публичное с 18.10 — минуты GitHub Actions бесплатны и без лимита.
#   gh workflow run app.yml                # всё: .ipa, юнит-тесты, UI-тесты (скриншоты ui-* и кадры anim-*)
#   gh workflow run app.yml -f mode=unit   # только юнит-тесты (PetTests) с покрытием
#   gh workflow run app.yml -f mode=ui     # только UI-тесты (PetUITests): скриншоты и контактные листы anim-*
#   gh workflow run app.yml -f mode=ipa    # только .ipa (то же, что старое -f tests=false)
#   gh workflow run app.yml -f mode=perf -f base=<ref> [-f rounds=3] [-f perf_only=PerfUITests/testPerfIdle]
#                                          # волна 27: PerfUITests этой ветки против <ref> на ОДНОМ раннере вперемешку
#                                          # (ABBA); тесты замеров у обеих сторон — из этой ветки. RESEARCH/13-perf.md
# Волна 24: параллельно. plan решает по mode, что запускать; ipa — своим job (Release-сборка больше не стоит
# перед тестами); тесты — двумя шардами на своих раннерах, у каждого своя build-for-testing и свой симулятор:
#   шард 1 — PetTests (с покрытием) + AnimationUITests + FirstMinutesUITests + GuideUITests
#            + AccessibilityUITests без testAccessibilityAudit4Games (волна 31: шард 2 уже ≈ 30 мин)
#   шард 2 — остальные PetUITests (-skip-testing шардов 1 и 3: новый класс UI-тестов попадает сюда сам)
#   шард 3 — двор 3D и замеры: YardScreenUITests + PerfUITests + SinksUITests + LevelUITests (27.10)
#            + YardDemoUITests: районы, ярусы и облик станций (волна 45 P: шард 1 подходил к 60 мин job)
#   Волна 45 P: каждый шард начинает с A0WarmUpUITests (прогрев: установка, RealityKit, шейдеры), чтобы холодный
#   старт не съедал 3 мин первого настоящего теста. Время тестов — шаг «Test times» (.github/scripts/test_times.py).
# merge собирает части в прежние артефакты Pet-screens и Pet-xcresult (Pet-anim и Pet-ipa кладутся сразу целиком).
# Подробно — RESEARCH/11-ci-testing.md.
name: app
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Что делать: all | ipa | unit | ui | perf"
        type: choice
        options: [all, ipa, unit, ui, perf]
        default: all
      tests:
        description: "Старый флаг: false — только .ipa (как mode=ipa)"
        type: boolean
        default: true
      base:
        description: "mode=perf: с чем сравнивать (ветка, тег или коммит)"
        type: string
        default: main
      rounds:
        description: "mode=perf: сколько раундов (в каждом обе сборки по разу)"
        type: string
        default: "3"
      perf_only:
        description: "mode=perf: класс или тест внутри PetUITests"
        type: string
        default: PerfUITests
concurrency:
  group: app-${{ github.ref }}   # ветки собираются параллельно, повтор на той же ветке отменяет старый прогон
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ipa: ${{ steps.mode.outputs.ipa }}
      tests: ${{ steps.mode.outputs.tests }}
      ui: ${{ steps.mode.outputs.ui }}
      shards: ${{ steps.mode.outputs.shards }}
      perf: ${{ steps.mode.outputs.perf }}
    steps:
      - name: Mode
        id: mode
        env:
          MODE_IN: ${{ inputs.mode }}
          TESTS_IN: ${{ inputs.tests }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          mode = os.environ.get("MODE_IN") or "all"
          if os.environ.get("TESTS_IN") == "false":
              mode = "ipa"
          if mode not in ("ipa", "unit", "ui", "perf"):
              mode = "all"
          # Шард 1 — длинные классы; разбивка по замеру волны 24, чтобы шарды кончали вместе (RESEARCH/11, «Минуты»).
          long_ui = ["AnimationUITests", "FirstMinutesUITests", "GuideUITests",
                     # волна 31: аудит доступности — по тестам, игры остаются в шарде 2
                     "AccessibilityUITests/testAccessibilityAudit1Main", "AccessibilityUITests/testAccessibilityAudit2Sheets",
                     "AccessibilityUITests/testAccessibilityAudit3Shops", "AccessibilityUITests/testAccessibilityExtraLargeText",
                     # волна 36 Q: превью двора теперь рисует 3D (раньше было пустым) — 1–2 кадра/с на CI, весь класс
                     # в шард 1: шард 2 и без него шёл 40–43 мин из 45 и с ним падал по таймауту
                     # волна 41 H: ожидания «выбор принят» и «кадр нарисован» вместо пауз дороже при 3D — шард 1 упёрся
                     # в 45 мин (прогон 40718623848); районы днём и ночью уехали в шард 3 (он шёл 19 мин)
                     # волна 45 P: облик станций и ярусы — в шард 3: шард 1 шёл 45–56 мин из 60 (прогон 40771420002),
                     # а в прогоне 40765117525 job отменили по 60 мин посреди UI-тестов
                     "YardDemoUITests/testYard1Stations", "YardDemoUITests/testYard1bStations",
                     "YardDemoUITests/testYard5WeatherChips"]
          # Шард 3 (27.10, волна 38): шард 2 дошёл до 44 м 42 с из 45 — двор 3D (YardScreenUITests 11,9 мин),
          # замеры (3,2) и мелкие экраны двора уехали на свой раннер. Замер 27.10: шард 1 ≈ 35, 2 ≈ 25, 3 ≈ 17 мин.
          # Волна 45 P: шард 3 шёл 31–35 мин (UI 22–25) — забрал из шарда 1 облик станций и ярусы.
          yard_ui = ["YardScreenUITests", "PerfUITests", "SinksUITests", "LevelUITests",
                     "YardDemoUITests/testYard1cLooks", "YardDemoUITests/testYard2Tiers",
                     "YardDemoUITests/testYard3Districts", "YardDemoUITests/testYard4DistrictsNight"]
          # Волна 45 P: прогрев первым в каждом шарде. В -skip-testing его нет — шард 2 берёт его сам.
          warm_ui = ["A0WarmUpUITests"]
          only_long = " ".join(f"-only-testing:PetUITests/{c}" for c in warm_ui + long_ui)
          only_yard = " ".join(f"-only-testing:PetUITests/{c}" for c in warm_ui + yard_ui)
          rest = "-only-testing:PetUITests " + " ".join(f"-skip-testing:PetUITests/{c}" for c in long_ui + yard_ui)
          unit, ui = mode in ("all", "unit"), mode in ("all", "ui")
          shards = []
          if unit or ui:
              shards.append({"shard": "1", "unit": "1" if unit else "0", "ui": only_long if ui else "", "anim": "1" if ui else "0"})
          if ui:
              shards.append({"shard": "2", "unit": "0", "ui": rest, "anim": "0"})
              shards.append({"shard": "3", "unit": "0", "ui": only_yard, "anim": "0"})
          # Пустой matrix — ошибка разбора даже у пропущенного job: держим заглушку, job всё равно не запустится.
          print(f"ipa={int(mode in ('all', 'ipa'))}")
          print(f"tests={int(bool(shards))}")
          print(f"ui={int(ui)}")
          print(f"perf={int(mode == 'perf')}")
          print("shards=" + json.dumps(shards or [{"shard": "0", "unit": "0", "ui": "", "anim": "0"}]))
          import sys
          print(f"Режим: {mode}; шарды: {json.dumps(shards, ensure_ascii=False)}", file=sys.stderr)
          PY
          cat "$GITHUB_OUTPUT"

  ipa:
    needs: plan
    if: ${{ needs.plan.outputs.ipa == '1' }}
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      OUT: ${{ github.workspace }}/app/out
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xcodegen

      - name: Build ipa
        timeout-minutes: 30
        run: |
          mkdir -p "$OUT"
          xcodebuild -project Pet.xcodeproj -scheme Pet \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Ad-hoc sign with entitlements
        # Без подписи в бинарнике нет entitlements, и сайдлоадер не узнает про App Group.
        # Пути к .entitlements берём из настроек сборки, чтобы не зависеть от раскладки project.yml.
        run: |
          ent() {
            xcodebuild -project Pet.xcodeproj -target "$1" -configuration Release -sdk iphoneos \
              -showBuildSettings 2>/dev/null | awk -F ' = ' '$1 ~ /^ *CODE_SIGN_ENTITLEMENTS$/ {print $2; exit}'
          }
          APP_ENT=$(ent Pet); EXT_ENT=$(ent PetWidgets)
          echo "entitlements: Pet=$APP_ENT PetWidgets=$EXT_ENT"
          test -f "$APP_ENT" && test -f "$EXT_ENT"
          APP=build/Build/Products/Release-iphoneos/Pet.app
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign -f -s - {} \;
          fi
          codesign -f -s - --entitlements "$EXT_ENT" "$APP/PlugIns/PetWidgets.appex"
          codesign -f -s - --entitlements "$APP_ENT" "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | tee /dev/stderr | grep -q 'group.com.vadimpet.pet'
          codesign -d --entitlements - "$APP/PlugIns/PetWidgets.appex" 2>/dev/null | grep -q 'group.com.vadimpet.pet'

      - name: Package ipa
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/Pet.app ipa/Payload/
          cd ipa && zip -qry "$OUT/Pet.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Pet-ipa
          path: app/out/Pet.ipa
          retention-days: 30

  test:
    needs: plan
    if: ${{ needs.plan.outputs.tests == '1' }}
    name: test ${{ matrix.shard }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false   # упал один шард — второй всё равно доснимает свои картинки
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    defaults:
      run:
        working-directory: app
    env:
      OUT: ${{ github.workspace }}/app/out
      RUN_UNIT: ${{ matrix.unit }}
      UI_ARGS: ${{ matrix.ui }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - name: Out
        run: mkdir -p "$OUT/screens" "$OUT/anim"

      # Выбираем и будим симулятор сразу: первая загрузка с миграцией данных идёт 1,5–3 мин, пусть идёт под сборку.
      - uses: ./.github/actions/simulator

      - uses: ./.github/actions/xcodegen

      - name: Build for testing
        id: bft
        timeout-minutes: 15
        # Одна сборка на оба набора шарда; покрытие вшивается при сборке — включаем, только когда будут юнит-тесты.
        # Симулятор подписываем ad-hoc ("-"): так entitlements (App Group) встают и без команды.
        # Загрузку симулятора не ждём: сборке нужен только его id, ждём после (шаг «Simulator ready»).
        run: |
          COV=NO
          if [ "$RUN_UNIT" = 1 ]; then COV=YES; fi
          xcodebuild build-for-testing -project Pet.xcodeproj -scheme Pet \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build-sim -enableCodeCoverage "$COV" \
            -quiet CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual

      - name: Simulator ready
        if: ${{ !cancelled() && steps.bft.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b | tail -n 2
          xcrun simctl status_bar "$SIM_UDID" override --time 9:41 \
            --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

      - name: Unit tests
        if: ${{ matrix.unit == '1' && !cancelled() && steps.bft.outcome == 'success' }}
        timeout-minutes: 10
        # TEST_RUNNER_* уходит в процесс тестов без префикса: SNAPSHOT_DIR видят WidgetSnapshotTests.
        run: |
          TEST_RUNNER_SNAPSHOT_DIR="$OUT/screens" \
          xcodebuild test-without-building -project Pet.xcodeproj -scheme Pet \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build-sim -resultBundlePath "$OUT/PetTests.xcresult" \
            -only-testing:PetTests -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -quiet

      # С -quiet текста падений в логе нет — печатаем его из xcresult.
      - name: Unit failures
        if: ${{ failure() && matrix.unit == '1' }}
        run: |
          xcrun xcresulttool get test-results summary --path "$OUT/PetTests.xcresult" | python3 -c 'import json,sys; [print(f.get("testIdentifierString"), "|", f.get("failureText")) for f in json.load(sys.stdin).get("testFailures", [])]' || true

      - name: Coverage
        if: ${{ matrix.unit == '1' && !cancelled() && steps.bft.outcome == 'success' }}
        run: |
          if [ ! -d "$OUT/PetTests.xcresult" ]; then echo "xcresult юнит-тестов нет"; exit 0; fi
          xcrun xccov view --report --only-targets "$OUT/PetTests.xcresult" | tee "$OUT/coverage.txt" || true

      - name: UI tests
        # Идут и после упавших юнит-тестов: скриншоты и кадры нужны всё равно.
        # UI_ARGS — выборка шарда (-only-testing/-skip-testing), разбивается по пробелам намеренно.
        if: ${{ matrix.ui != '' && !cancelled() && steps.bft.outcome == 'success' }}
        timeout-minutes: 45
        run: |
          # shellcheck disable=SC2086
          xcodebuild test-without-building -project Pet.xcodeproj -scheme Pet \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build-sim -resultBundlePath "$OUT/PetUITests-$SHARD.xcresult" \
            $UI_ARGS \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -quiet

      # Волна 41 H: как у юнит-тестов — с -quiet в логе видно только имя упавшего UI-теста, а причина
      # (какая проверка, таймаут ли) лежит в xcresult. Печатаем её сюда, чтобы не качать xcresult.
      - name: UI failures
        if: ${{ failure() && matrix.ui != '' }}
        run: |
          R="$OUT/PetUITests-$SHARD.xcresult"
          if [ ! -d "$R" ]; then echo "xcresult UI-тестов нет"; exit 0; fi
          xcrun xcresulttool get test-results summary --path "$R" | python3 -c 'import json,sys; [print(f.get("testIdentifierString"), "|", f.get("failureText")) for f in json.load(sys.stdin).get("testFailures", [])]' || true

      - name: Perf metrics
        # Замеры PerfUITests (волна 26): xcodebuild идёт с -quiet, поэтому числа берём из xcresult и печатаем сюда.
        # Сводка — среднее по итерациям; полный JSON — perf-<шард>.json в Pet-xcresult.
        if: ${{ matrix.ui != '' && !cancelled() }}
        run: |
          R="$OUT/PetUITests-$SHARD.xcresult"
          if [ ! -d "$R" ]; then echo "xcresult UI-тестов нет"; exit 0; fi
          xcrun xcresulttool get test-results metrics --path "$R" > "$OUT/perf-$SHARD.json" || { echo "метрик нет"; exit 0; }
          python3 ../.github/scripts/perf.py print "$OUT/perf-$SHARD.json"

      - name: Test times
        # Волна 45 P: время каждого теста и сумма по классам (с -quiet в логе его нет) — для балансировки шардов
        # и чтобы видеть тесты у потолка 3 мин. Только печать, шаг не падает.
        if: ${{ !cancelled() }}
        run: |
          for R in "$OUT"/*.xcresult; do
            [ -d "$R" ] || continue
            N=$(basename "$R" .xcresult)
            echo "== $N"
            xcrun xcresulttool get test-results tests --path "$R" > "$OUT/times-$N.json" \
              && python3 ../.github/scripts/test_times.py "$OUT/times-$N.json" 20 || echo "времени нет: $N"
          done

      - name: Export screenshots
        # Вложения из каждого xcresult (Xcode 16+): файлы с UUID-именами + manifest.json с читаемыми именами.
        # Всё — в screens/, контактные листы анимации anim-* ещё и отдельно в anim/.
        if: ${{ !cancelled() }}
        run: |
          RAW="$RUNNER_TEMP/attachments"
          rm -rf "$RAW" && mkdir -p "$RAW"
          for R in "$OUT"/*.xcresult; do
            [ -d "$R" ] || continue
            D="$RAW/$(basename "$R" .xcresult)"
            mkdir -p "$D"
            xcrun xcresulttool export attachments --path "$R" --output-path "$D" || echo "не выгрузилось: $R"
          done
          python3 - "$RAW" "$OUT/screens" "$OUT/anim" <<'PY'
          import json, pathlib, re, shutil, sys
          raw, dst, anim = map(pathlib.Path, sys.argv[1:])
          dst.mkdir(parents=True, exist_ok=True)
          anim.mkdir(parents=True, exist_ok=True)
          total = 0
          for d in sorted(p for p in raw.iterdir() if p.is_dir()):
              manifest = d / "manifest.json"
              if not manifest.exists():
                  print(f"{d.name}: вложений нет")
                  continue
              n = 0
              for test in json.loads(manifest.read_text()):
                  for a in test.get("attachments", []):
                      src = d / a["exportedFileName"]
                      name = a.get("suggestedHumanReadableName") or src.name
                      # «ui-01-main_0_<UUID>.png» → «ui-01-main.png»
                      name = re.sub(r"_\d+_[0-9A-Fa-f-]{36}(?=\.[^.]+$|$)", "", name)
                      if not pathlib.Path(name).suffix:
                          name += src.suffix
                      # «Debug description for `"x" Any`» при упавшем тесте: кавычки и пр. upload-artifact не берёт
                      # и теряет все кадры шарда (прогон 39382964447).
                      name = re.sub(r'[":<>|*?\r\n]', "_", name)
                      shutil.copy2(src, dst / name)
                      if name.startswith("anim-"):
                          shutil.copy2(src, anim / name)
                      n += 1
              print(f"{d.name}: вложений {n}")
              total += n
          print(f"всего вложений: {total} → {dst}")
          PY
          ls -1 "$OUT/screens"
          echo "кадры анимации:"
          ls -1 "$OUT/anim"

      # Части шарда; merge склеит их в Pet-screens и Pet-xcresult и удалит.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Pet-screens-part-${{ matrix.shard }}
          path: app/out/screens
          if-no-files-found: warn
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Pet-xcresult-part-${{ matrix.shard }}
          path: |
            app/out/*.xcresult
            app/out/coverage.txt
            app/out/perf-*.json
            app/out/times-*.json
          if-no-files-found: ignore
          retention-days: 1

      # Кадры anim-* снимает только AnimationUITests — он целиком в одном шарде, артефакт сразу под прежним именем.
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.anim == '1' && !cancelled() }}
        with:
          name: Pet-anim
          path: app/out/anim
          if-no-files-found: ignore
          retention-days: 14

  perf:
    # Волна 27: A/B замер PerfUITests на одном раннере. Разброс между раннерами больше эффекта правок (запуск одного
    # кода — от 4,3 до 25,6 с), поэтому обе сборки — эта ветка (head) и inputs.base — собираются на одном раннере и
    # гоняются вперемешку: раунд 1 head→base, раунд 2 base→head, … Тесты замеров у base берём из этой ветки, чтобы
    # мерить одно и то же. Сводка — строки «AB …» в шаге «A/B summary», JSON — артефакт Pet-perf.
    needs: plan
    if: ${{ needs.plan.outputs.perf == '1' }}
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    env:
      OUT: ${{ github.workspace }}/app/out/perf
      BASE_REF: ${{ inputs.base }}
      ROUNDS: ${{ inputs.rounds }}
      PERF_ONLY: ${{ inputs.perf_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/simulator

      - name: Base worktree
        run: |
          mkdir -p "$OUT"
          git fetch -q origin "$BASE_REF" 2>/dev/null || true
          REF=$(git rev-parse --verify -q "origin/$BASE_REF^{commit}" || git rev-parse --verify "$BASE_REF^{commit}")
          echo "head $(git rev-parse --short HEAD), base $BASE_REF = $(git rev-parse --short "$REF")"
          git worktree add -q --detach ../.base "$REF"
          cp UITests/PerfUITests.swift ../.base/app/UITests/PerfUITests.swift

      - uses: ./.github/actions/xcodegen
      - uses: ./.github/actions/xcodegen
        with:
          dir: .base/app

      - name: Build head and base
        timeout-minutes: 30
        run: |
          for D in . ../.base/app; do
            (cd "$D" && xcodebuild build-for-testing -project Pet.xcodeproj -scheme Pet \
              -destination "platform=iOS Simulator,id=$SIM_UDID" \
              -derivedDataPath build-sim -enableCodeCoverage NO \
              -quiet CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual)
          done

      - name: Simulator ready
        timeout-minutes: 10
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b | tail -n 2
          xcrun simctl status_bar "$SIM_UDID" override --time 9:41 \
            --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

      - name: A/B rounds
        timeout-minutes: 60
        run: |
          run_side() {
            local side=$1 r=$2 dir=.
            [ "$side" = base ] && dir=../.base/app
            echo "раунд $r: $side"
            (cd "$dir" && xcodebuild test-without-building -project Pet.xcodeproj -scheme Pet \
              -destination "platform=iOS Simulator,id=$SIM_UDID" \
              -derivedDataPath build-sim -resultBundlePath "$OUT/$side-$r.xcresult" \
              "-only-testing:PetUITests/$PERF_ONLY" \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
              2>&1 | grep -E "^Test Case|error:") || true
            # Упавший тест — причина из xcresult (сам xcresult в артефакт не идёт: он большой).
            xcrun xcresulttool get test-results summary --path "$OUT/$side-$r.xcresult" \
              | python3 -c 'import json,sys; [print("раунд '"$r $side"': упал", f.get("testIdentifierString"), "—", f.get("failureText")) for f in json.load(sys.stdin).get("testFailures", [])]' \
              || echo "раунд $r $side: сводки нет"
            xcrun xcresulttool get test-results metrics --path "$OUT/$side-$r.xcresult" > "$OUT/perf-$side-$r.json" \
              || echo "раунд $r $side: метрик нет"
          }
          for r in $(seq 1 "$ROUNDS"); do
            if [ $((r % 2)) = 1 ]; then run_side head "$r"; run_side base "$r"
            else run_side base "$r"; run_side head "$r"; fi
          done

      - name: A/B summary
        if: ${{ !cancelled() }}
        run: python3 ../.github/scripts/perf.py ab "$OUT"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Pet-perf
          path: app/out/perf/perf-*.json
          if-no-files-found: ignore
          retention-days: 14

  merge:
    # Прежние имена артефактов для gh run download: Pet-screens (PNG всех шардов) и Pet-xcresult (все xcresult).
    needs: [plan, test]
    if: ${{ !cancelled() && needs.plan.outputs.tests == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/upload-artifact/merge@v4
        # Если ни один шард не дошёл до картинок, частей нет — красным прогон сделают сами тесты, не merge.
        continue-on-error: true
        with:
          name: Pet-screens
          pattern: Pet-screens-part-*
          delete-merged: true
          retention-days: 14

      - uses: actions/upload-artifact/merge@v4
        # Шард мог упасть до первого xcresult — тогда склеивать нечего, это не повод ронять merge.
        continue-on-error: true
        with:
          name: Pet-xcresult
          pattern: Pet-xcresult-part-*
          delete-merged: true
          retention-days: 7
